<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#12063A">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Frostkeep — a neon rhythm runner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Chakra+Petch:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --night:#12063A; --deep:#1B0B52; --violet:#4B1FA8; --ice:#3EE8FF; --frost:#E9FBFF;
  --lime:#9BFF2E; --lime-dark:#3C8F00; --ember:#FFB547; --rose:#FF4FD8;
  --ink:#E9FBFF; --muted:#B9A8F0; --panel:rgba(18,6,58,.74); --scrim:rgba(18,6,58,.86);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --panel:rgba(12,4,40,.8); --scrim:rgba(12,4,40,.88); } }
:root[data-theme="dark"]{ --panel:rgba(12,4,40,.8); --scrim:rgba(12,4,40,.88); }
*,*::before,*::after{box-sizing:inherit}
html{height:100%;background:var(--night);scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;height:100%;background:var(--night);color:var(--ink);overflow:hidden;
  font-family:'Chakra Petch','Segoe UI',system-ui,sans-serif;font-weight:500;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
#stage{position:relative;width:100%;height:100%;overflow:hidden;touch-action:none}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.hud{position:absolute;inset:0;pointer-events:none;
  padding:10px max(12px,env(safe-area-inset-right,0px)) 0 max(12px,env(safe-area-inset-left,0px))}
.progress{position:absolute;top:12px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:10px;
  width:min(46vw,380px);transition:opacity .3s}
.track{flex:1;height:10px;border-radius:6px;background:rgba(233,251,255,.14);border:1.5px solid rgba(233,251,255,.5);overflow:hidden}
.fill{height:100%;width:0;background:linear-gradient(90deg,var(--lime),var(--ice));box-shadow:0 0 10px var(--ice)}
.pct{font-family:Bungee,Impact,'Arial Black',sans-serif;font-size:15px;min-width:3.2em;text-shadow:0 2px 0 var(--violet)}
.corner{position:absolute;top:6px;right:max(10px,env(safe-area-inset-right,0px));display:flex;gap:8px;pointer-events:auto}
.icon-btn{width:44px;height:44px;border-radius:12px;border:2px solid rgba(233,251,255,.55);background:rgba(18,6,58,.45);
  color:var(--frost);display:grid;place-items:center;cursor:pointer;padding:0}
.icon-btn svg{width:22px;height:22px}
.icon-btn:active{transform:scale(.94)}
button:focus-visible{outline:3px solid var(--frost);outline-offset:3px}
.badge{position:absolute;top:14px;left:max(14px,env(safe-area-inset-left,0px));font-family:Bungee,Impact,sans-serif;font-size:13px;
  color:var(--lime);display:none;align-items:center;gap:6px;text-shadow:0 2px 0 var(--night)}
.badge::before{content:"";width:10px;height:10px;background:var(--lime);transform:rotate(45deg);box-shadow:0 0 8px var(--lime)}
.flash{position:absolute;top:44px;left:50%;transform:translateX(-50%);font-family:Bungee,Impact,sans-serif;
  font-size:clamp(22px,7vh,44px);color:var(--frost);text-shadow:0 3px 0 var(--violet),0 0 18px rgba(62,232,255,.7);opacity:0;white-space:nowrap}
.flash.show{animation:flash 1s ease-out forwards}
@keyframes flash{0%{opacity:0;transform:translate(-50%,8px) scale(.9)}15%{opacity:1;transform:translate(-50%,0) scale(1.05)}70%{opacity:1}100%{opacity:0;transform:translate(-50%,-6px)}}

.screen{position:absolute;inset:0;display:none;pointer-events:auto}
.screen.on{display:flex}
#menu{background:linear-gradient(90deg,var(--scrim) 0%,rgba(18,6,58,.55) 48%,rgba(18,6,58,0) 78%);
  align-items:center;padding:16px max(28px,env(safe-area-inset-right,0px)) 16px max(28px,calc(env(safe-area-inset-left,0px) + 20px))}
.menu-inner{max-width:560px}
.title{font-family:Bungee,Impact,'Arial Black',sans-serif;font-weight:400;margin:0;line-height:.9;
  font-size:clamp(44px,17vh,124px);color:var(--frost);letter-spacing:.01em;
  text-shadow:.035em .035em 0 var(--ice),.07em .07em 0 #2B1585,.1em .1em 0 #1B0B52,0 0 .45em rgba(62,232,255,.55)}
.tagline{margin:clamp(8px,2.4vh,16px) 0 clamp(12px,3.6vh,24px);font-size:clamp(14px,3.6vh,18px);color:var(--muted);max-width:34ch;line-height:1.4}
.actions{display:flex;gap:12px;flex-wrap:wrap}
.btn{font-family:Bungee,Impact,sans-serif;font-size:clamp(16px,4.4vh,22px);border-radius:14px;cursor:pointer;
  padding:.55em 1.2em .5em;border:0;transition:transform .08s}
.btn:active{transform:translateY(3px)}
.btn-go{background:var(--lime);color:var(--night);box-shadow:0 5px 0 var(--lime-dark),0 0 24px rgba(155,255,46,.45)}
.btn-go:active{box-shadow:0 2px 0 var(--lime-dark)}
.btn-alt{background:transparent;color:var(--ice);border:2.5px solid var(--ice);box-shadow:0 5px 0 rgba(62,232,255,.3)}
.stats{display:flex;gap:22px;margin-top:clamp(12px,3.6vh,22px);font-size:clamp(13px,3.4vh,15px);color:var(--muted)}
.stats b{display:block;font-family:Bungee,Impact,sans-serif;font-weight:400;color:var(--frost);font-size:clamp(18px,5.4vh,26px)}
.hint{margin-top:clamp(10px,3vh,18px);font-size:clamp(12px,3.2vh,14px);color:var(--muted);opacity:.85}
.fs-btn{background:none;border:0;color:var(--ice);font:inherit;text-decoration:underline;text-underline-offset:3px;cursor:pointer;padding:0;margin-left:4px}

.center{align-items:center;justify-content:center;background:rgba(12,4,40,.62);text-align:center}
.panel{background:var(--panel);border:2px solid rgba(62,232,255,.55);border-radius:22px;padding:clamp(16px,5vh,30px) clamp(22px,5vw,44px);
  box-shadow:0 0 0 6px rgba(75,31,168,.45),0 0 40px rgba(62,232,255,.25);max-width:min(92vw,520px)}
.panel h2{font-family:Bungee,Impact,sans-serif;font-weight:400;margin:0 0 6px;font-size:clamp(28px,9vh,48px);color:var(--frost);
  text-shadow:.04em .04em 0 var(--ice),.08em .08em 0 #2B1585}
.panel p{margin:0 0 clamp(12px,4vh,22px);color:var(--muted);font-size:clamp(14px,3.6vh,17px)}
.panel .actions{justify-content:center}

#rotate{flex-direction:column;gap:14px}
.phone{width:46px;height:78px;border:4px solid var(--ice);border-radius:10px;animation:turn 2.2s ease-in-out infinite;box-shadow:0 0 18px rgba(62,232,255,.5)}
@keyframes turn{0%,25%{transform:rotate(0)}55%,85%{transform:rotate(-90deg)}100%{transform:rotate(0)}}
@media (prefers-reduced-motion: reduce){.phone{animation:none;transform:rotate(-90deg)}.flash.show{animation-duration:.01s}}
</style>
</head>
<body>
<div id="stage">
  <canvas id="game" aria-label="Frostkeep game. Tap, click or press Space to jump."></canvas>
  <div class="hud">
    <div class="badge" id="badge">Practice</div>
    <div class="progress" id="progress"><div class="track"><div class="fill" id="fill"></div></div><div class="pct" id="pct">0%</div></div>
    <div class="flash" id="flash"></div>
    <div class="corner">
      <button class="icon-btn" id="soundBtn" aria-label="Mute music"></button>
      <button class="icon-btn" id="pauseBtn" aria-label="Pause"><svg viewBox="0 0 24 24" fill="currentColor"><rect x="5" y="4" width="5" height="16" rx="1.5"/><rect x="14" y="4" width="5" height="16" rx="1.5"/></svg></button>
    </div>
  </div>

  <section class="screen on" id="menu" aria-label="Main menu">
    <div class="menu-inner">
      <h1 class="title">Frost<br>keep</h1>
      <p class="tagline">Run the ice castle to the beat. One touch, five checkpoints.</p>
      <div class="actions">
        <button class="btn btn-go" id="playBtn">Play</button>
        <button class="btn btn-alt" id="practiceBtn">Practice</button>
      </div>
      <div class="stats"><div>Best run<b id="bestStat">0%</b></div><div>Attempts<b id="attStat">0</b></div></div>
      <div class="hint">Tap, click or Space to jump. In the ship, hold to rise.<button class="fs-btn" id="fsBtn" hidden>Go fullscreen</button></div>
    </div>
  </section>

  <section class="screen center" id="pause" aria-label="Paused">
    <div class="panel"><h2>Paused</h2><p id="pauseInfo">Take a breath.</p>
      <div class="actions"><button class="btn btn-go" id="resumeBtn">Resume</button><button class="btn btn-alt" id="restartBtn">Restart level</button><button class="btn btn-alt" id="quitBtn">Menu</button></div>
    </div>
  </section>

  <section class="screen center" id="done" aria-label="Level complete">
    <div class="panel"><h2 id="doneTitle">Keep cleared</h2><p id="doneInfo"></p>
      <div class="actions"><button class="btn btn-go" id="againBtn">Play again</button><button class="btn btn-alt" id="doneMenuBtn">Menu</button></div>
    </div>
  </section>

  <section class="screen center" id="rotate" aria-label="Rotate your device">
    <div class="phone"></div>
    <div class="panel" style="padding:18px 26px"><p style="margin:0 0 14px">Turn your phone sideways for the full view.</p>
      <button class="btn btn-alt" id="portraitBtn">Play upright anyway</button></div>
  </section>
</div>
<script>
// ===== Core: level + deterministic physics (shared by game and test bot) =====
const CORE = (() => {
  const SPEED = 9.0, G = 86, JUMP = 19.6, PAD_V = 29, ORB_V = 18.5;
  const BUFFER = 0.13, COYOTE = 0.09, ORB_R = 1.4;
  const SHIP_UP = 36, SHIP_DOWN = 32, SHIP_MAX = 7.5, CEIL = 9, DT = 1 / 240;

  function buildLevel() {
    const objs = []; let id = 0;
    const add = (o) => { o.id = id++; objs.push(o); };
    const S = (x, y = 0) => add({ t: 'spike', x, y, w: 1, h: 1, down: false });
    const SD = (x, y) => add({ t: 'spike', x, y, w: 1, h: 1, down: true });
    const SR = (x, n, y = 0) => { for (let i = 0; i < n; i++) S(x + i, y); };
    const B = (x, y, w = 1, h = 1) => add({ t: 'block', x, y, w, h });
    const P = (x, y = 0) => add({ t: 'pad', x, y, w: 1, h: 0.3 });
    const O = (x, y) => add({ t: 'orb', x, y, w: 1, h: 1 });
    const GATE = (x, mode, y = 0) => add({ t: 'portal', x, y, w: 1, h: 3, mode });
    const CP = (x, mode = 'cube', y = 0) => add({ t: 'checkpoint', x, y, w: 1, h: 0, mode });

    // A — warm up: single spikes with lots of room
    S(20); S(32); S(44);
    B(54, 0, 4, 1); S(66);
    B(74, 0, 4, 1); B(80, 0, 4, 1);
    S(91); S(101);
    CP(104);
    SR(110, 2); S(122);
    B(130, 0, 6, 1);
    SR(144, 2);
    CP(150);
    // B — pads and orbs, one at a time
    P(156); SR(158, 3);
    SR(172, 5); O(173, 2);
    SR(188, 2); S(198);
    P(208); SR(210, 3);
    // C — ship, wide lanes
    GATE(224, 'ship', 0);
    CP(232, 'ship', 4);
    B(240, 0, 2, 3); B(252, 6, 2, 3); B(264, 0, 2, 3); B(276, 6, 2, 3);
    B(288, 0, 2, 2); B(288, 7, 2, 2);
    B(300, 0, 12, 2); B(300, 7, 12, 2);
    for (let x = 302; x < 312; x += 3) S(x, 2);
    B(320, 0, 2, 3);
    GATE(330, 'cube', 3);
    CP(336);
    // D — finale: a little more going on
    S(344); SR(354, 2); S(364);
    B(372, 0, 6, 1); SR(382, 2);
    B(392, 0, 3, 2); SR(395, 2); B(397, 0, 3, 2);
    CP(401);
    SR(408, 6); O(410, 2);
    P(424); SR(426, 3);
    SR(440, 2); S(452); B(460, 0, 4, 1); SR(468, 2);

    objs.sort((a, b) => a.x - b.x);
    const length = 482;
    const buckets = [];
    for (let c = 0; c <= length + 4; c++) buckets.push([]);
    for (const o of objs) {
      for (let c = Math.floor(o.x); c < Math.ceil(o.x + o.w); c++) if (buckets[c]) buckets[c].push(o);
    }
    // ship zones for ceiling rendering
    const zones = []; let start = null;
    for (const o of objs) if (o.t === 'portal') {
      if (o.mode === 'ship') start = o.x; else if (start !== null) { zones.push([start, o.x]); start = null; }
    }
    const cps = objs.filter(o => o.t === 'checkpoint');
    return { objs, buckets, length, zones, cps };
  }

  function newState() {
    return { x: 0, y: 0, vy: 0, mode: 'cube', grounded: true, dead: false, won: false,
      lastOrb: -1, lastPad: -1, events: 0, buf: 0, coy: 0, prevHeld: false };
  }
  function clone(s) { return Object.assign({}, s); }
  // the fixed state you respawn in at a checkpoint flag
  function spawnAt(cp) {
    const s = newState(); s.x = cp.x; s.y = cp.y; s.mode = cp.mode; s.grounded = cp.mode === 'cube' && cp.y === 0;
    return s;
  }

  // events bitmask: 1 jump, 2 land, 4 orb, 8 pad, 16 ship gate, 32 cube gate, 64 dead, 128 won
  function step(s, held, L) {
    if (s.dead || s.won) return;
    s.events = 0;
    const prevX = s.x;
    s.x += SPEED * DT;
    if (held && !s.prevHeld) s.buf = BUFFER; else if (s.buf > 0) s.buf -= DT;
    s.prevHeld = held;
    const want = held || s.buf > 0;
    if (s.mode === 'cube') {
      if (want && (s.grounded || s.coy > 0) && s.vy <= 0.01) { s.vy = JUMP; s.grounded = false; s.coy = 0; s.buf = 0; s.events |= 1; }
      s.vy -= G * DT; if (s.vy < -32) s.vy = -32;
    } else {
      s.vy += (held ? SHIP_UP : -SHIP_DOWN) * DT;
      if (s.vy > SHIP_MAX) s.vy = SHIP_MAX; if (s.vy < -SHIP_MAX) s.vy = -SHIP_MAX;
    }
    s.y += s.vy * DT;
    const wasGrounded = s.grounded;
    s.grounded = false;
    if (s.y <= 0) { s.y = 0; if (s.vy < 0) s.vy = 0; s.grounded = true; }
    if (s.mode === 'ship' && s.y + 1 >= CEIL) { s.y = CEIL - 1; if (s.vy > 0) s.vy = 0; }

    const c0 = Math.floor(s.x);
    const cols = [L.buckets[c0] || [], L.buckets[c0 + 1] || []];
    // pass 1: blocks
    for (const col of cols) for (const o of col) {
      if (o.t !== 'block') continue;
      const px0 = s.x + 0.06, px1 = s.x + 0.94;
      if (px1 <= o.x || px0 >= o.x + o.w) continue;
      const top = o.y + o.h, bot = o.y;
      if (s.y >= top || s.y + 1 <= bot) continue;
      if (s.y >= top - 0.25 && s.vy <= 0.5) { s.y = top; if (s.vy <= 0) { s.vy = 0; s.grounded = true; } continue; }
      if (s.mode === 'ship' && s.y + 1 <= bot + 0.25) { s.y = bot - 1; if (s.vy > 0) s.vy = 0; continue; }
      s.dead = true; s.events |= 64; return;
    }
    if (s.grounded && !wasGrounded) s.events |= 2;
    if (s.grounded) s.coy = COYOTE; else if (s.coy > 0) s.coy -= DT;
    // pass 2: hazards and triggers
    const shipBox = s.mode === 'ship';
    const hx0 = s.x + 0.08, hx1 = s.x + 0.92;
    const hy0 = s.y + (shipBox ? 0.18 : 0.06), hy1 = s.y + (shipBox ? 0.82 : 0.94);
    for (const col of cols) for (const o of col) {
      if (o.t === 'spike') {
        const sx0 = o.x + 0.39, sx1 = o.x + 0.61;
        const sy0 = o.down ? o.y + 0.5 : o.y + 0.08, sy1 = o.down ? o.y + 0.92 : o.y + 0.5;
        if (hx1 > sx0 && hx0 < sx1 && hy1 > sy0 && hy0 < sy1) { s.dead = true; s.events |= 64; return; }
      } else if (o.t === 'pad') {
        if (s.lastPad !== o.id && s.x + 0.9 > o.x && s.x + 0.1 < o.x + 1 && s.y <= o.y + 0.35 && s.y + 1 > o.y) {
          s.lastPad = o.id; s.vy = s.mode === 'cube' ? PAD_V : 6; s.coy = 0; s.grounded = false; s.events |= 8;
        }
      } else if (o.t === 'orb') {
        if (want && !s.grounded && s.lastOrb !== o.id) {
          const dx = (s.x + 0.5) - (o.x + 0.5), dy = (s.y + 0.5) - (o.y + 0.5);
          if (dx * dx + dy * dy < ORB_R * ORB_R) {
            s.lastOrb = o.id;
            if (s.mode === 'cube') s.vy = ORB_V; else s.vy = 6; s.buf = 0; s.coy = 0;
            s.events |= 4;
          }
        }
      } else if (o.t === 'portal') {
        if (prevX + 0.5 < o.x + 0.5 && s.x + 0.5 >= o.x + 0.5 && s.mode !== o.mode) {
          s.mode = o.mode;
          if (o.mode === 'ship') { s.vy *= 0.4; s.events |= 16; } else { s.vy = Math.min(s.vy, 4); s.events |= 32; }
          s.grounded = false;
        }
      }
    }
    if (s.x >= L.length) { s.won = true; s.events |= 128; }
  }

  return { SPEED, G, JUMP, CEIL, DT, buildLevel, newState, clone, spawnAt, step };
})();




</script>
<script>
(() => {
'use strict';
const L = CORE.buildLevel();
const DT = CORE.DT, SPEED = CORE.SPEED;
const C = { night:'#12063A', deep:'#1B0B52', violet:'#4B1FA8', ice:'#3EE8FF', frost:'#E9FBFF',
  lime:'#9BFF2E', limeDark:'#2F7A00', ember:'#FFB547', rose:'#FF4FD8', brick:'#241068' };
const $ = (id) => document.getElementById(id);
const cv = $('game'), ctx = cv.getContext('2d');

// ---------- storage ----------
const store = {
  get(k, d) { try { const v = localStorage.getItem('frostkeep:' + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('frostkeep:' + k, JSON.stringify(v)); } catch (e) {} }
};
let best = store.get('best', 0), totalAttempts = store.get('attempts', 0), muted = store.get('muted', false);

// ---------- audio ----------
const Music = (() => {
  let ac = null, master = null, bus = null, timer = null, nextTime = 0, idx = 0, startT = 0, noise = null;
  const BPM = 140, SPB = 60 / BPM / 4;
  const chords = [[57, 60, 64], [53, 57, 60], [48, 52, 55], [55, 59, 62]];
  const mtof = (m) => 440 * Math.pow(2, (m - 69) / 12);
  function init() {
    if (ac) return;
    const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
    ac = new AC();
    const comp = ac.createDynamicsCompressor(); comp.threshold.value = -14; comp.ratio.value = 4;
    master = ac.createGain(); master.gain.value = muted ? 0 : 0.6;
    master.connect(comp); comp.connect(ac.destination);
    noise = ac.createBuffer(1, ac.sampleRate * 0.5, ac.sampleRate);
    const d = noise.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  }
  function env(node, t, a, peak, dur) {
    node.gain.setValueAtTime(0.0001, t); node.gain.exponentialRampToValueAtTime(peak, t + a);
    node.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  }
  function tone(type, f, t, dur, vol, out, f2, cutoff) {
    const o = ac.createOscillator(), g = ac.createGain(); o.type = type; o.frequency.setValueAtTime(f, t);
    if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + dur);
    let last = o;
    if (cutoff) { const fl = ac.createBiquadFilter(); fl.type = 'lowpass'; fl.frequency.value = cutoff; o.connect(fl); last = fl; }
    last.connect(g); g.connect(out); env(g, t, 0.005, vol, dur); o.start(t); o.stop(t + dur + 0.02);
  }
  function hiss(t, dur, vol, hp, out) {
    const s = ac.createBufferSource(); s.buffer = noise; const f = ac.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = hp;
    const g = ac.createGain(); s.connect(f); f.connect(g); g.connect(out); env(g, t, 0.002, vol, dur); s.start(t); s.stop(t + dur + 0.02);
  }
  const lead = [0, 2, 1, 2, 0, 2, 1, 2, 0, 2, 1, 2, 2, 1, 0, 1];
  function playStep(i, t) {
    const bar = (i >> 4) % 4, s = i % 16, ch = chords[bar], loop = Math.floor(i / 64);
    if (s % 4 === 0) tone('sine', 150, t, 0.16, 0.9, bus, 42);
    if (s === 4 || s === 12) { hiss(t, 0.14, 0.32, 1400, bus); tone('triangle', 200, t, 0.08, 0.2, bus, 120); }
    if (s % 2 === 1) hiss(t, 0.04, 0.09, 7000, bus);
    if (s % 2 === 0) tone('sawtooth', mtof(ch[0] - 24 + (s % 4 === 2 ? 12 : 0)), t, SPB * 1.7, 0.22, bus, 0, 520);
    tone('square', mtof(ch[lead[s]] + 12 + (s >= 8 && loop % 2 ? 12 : 0)), t, 0.09, 0.055, bus, 0, 2600);
    if (loop % 2 === 1 && s % 8 === 0) tone('triangle', mtof(ch[2] + 24), t, SPB * 6, 0.07, bus);
  }

// ---------- layout ----------

// ---------- game state ----------

}

// ---------- update ----------
function handleEvents(ev) {

  if (ev & 8) { Music.sfx('pad'); padHits.add(P.lastPad); ring(P.x + 0.5, P.y, C.ember); }

      const o = L.cps[nextCp++];

function drawGround(pulse) {

function drawCube(u, s) {

  ctx.beginPath(); ctx.roundRect ? ctx.roundRect(-h, -h, h * 2, h * 2, r) : ctx.rect(-h, -h, h * 2, h * 2); ctx.fill(); ctx.stroke();
  ctx.strokeStyle = C.limeDark; ctx.lineWidth = u * 0.07 * s; ctx.strokeRect(-h * 0.62, -h * 0.62, h * 1.24, h * 1.24);

function drawPlayer() {

    ctx.fillStyle = `rgba(155,255,46,${a * 0.35})`; ctx.fillRect(sx(t.x) - sz / 2, sy(t.y) - sz / 2, sz, sz);
  }

    ctx.lineTo(unit * 0.56, unit * 0.16); ctx.quadraticCurveTo(0, unit * 0.42, -unit * 0.62, unit * 0.22); ctx.closePath();

// ---------- loop ----------
let last = performance.now();

const fill = $('fill'), pctEl = $('pct'), pauseBtn = $('pauseBtn');
if (/[?&]debug/.test(location.search)) window.__fk = { warp(x, m) { P.x = x; P.y = 0; P.vy = 0; if (m) P.mode = m; }, hold(v) { held = v; }, get() { return { x: +P.x.toFixed(2), y: +P.y.toFixed(2), m: P.mode, mode, cps: checkpoints.length, freeze: +freeze.toFixed(2), deaths, attempt }; } };

// ---------- input ----------
function press(e) {

  held = true; Music.unlock();
}

// ---------- buttons ----------
const ICON_ON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V6l11-2v12"/><circle cx="6.5" cy="18" r="2.5" fill="currentColor"/><circle cx="17.5" cy="16" r="2.5" fill="currentColor"/></svg>';
